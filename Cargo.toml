[package]
name = "cargo-lock-align"
version = "1.0.0"
edition = "2024"
authors = ["harkerhand <harkerhand@outlook.com>"]
description = "Align a Rust project's Cargo.lock dependency versions with an existing lockfile."
license = "MIT OR Apache-2.0"
repository = "https://github.com/harkerhand/cargo-lock-align"
readme = "README.md"
keywords = ["cargo", "lockfile", "dependencies", "migration"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]

[dependencies]
anyhow = "1"
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive"] }
semver = "1"
toml = "0.9"
